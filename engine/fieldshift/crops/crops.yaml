# Crop knowledge base for the pilot region (Central Luzon, Philippines).
#
# EVERY VALUE HERE IS A PLANNING ASSUMPTION, NOT A MEASUREMENT OF YOUR FIELD.
# Each crop has a `sources` block naming where each group of values comes from, and a
# `verify` list naming the values the team is least sure about.  Anything sourced "TEAM" is a
# prototype estimate that a local agronomist should check before the tool is used for real.
#
# Units and meaning
#   seasons            wet = main rainy season, dry = the other half of the year
#   duration_days      days in the field from sowing/transplanting to harvest
#   t_base_c           base temperature for growing-degree days (GDD)
#   gdd_need           thermal time to maturity (deg C-days above t_base_c)
#   t_mean_range_c     seasonal mean air temperature the crop tolerates [min, max]
#   heat_limit_c       daily maximum temperature above which flowering / fruit set is damaged
#   water_need_mm      typical seasonal crop water requirement [low, high]
#   kc                 FAO-56 crop coefficients [initial, mid-season, end]
#   stages             share of the duration in [initial, development, mid, late] stages
#   root_depth_m       maximum effective rooting depth
#   depletion_p        fraction of available water that can be used before stress starts
#   ky                 FAO-33 seasonal yield-response factor to water deficit
#   paddy              true = grown in bunded, ponded fields (lowland rice)
#   salinity_threshold_ds_m   soil ECe above which yield starts to fall
#   ph_range           soil pH tolerated [min, max]
#   *_tolerance        1 (very sensitive) .. 5 (very tolerant)
#   n_fixing           true for legumes that fix nitrogen
#   n_credit_kg_ha     nitrogen left for the NEXT crop (legumes / green manure)
#   n_demand_kg_ha     nitrogen the crop needs from soil + fertiliser
#   residue_cover      1 (bare, little residue) .. 5 (dense cover, much residue)
#   residue_c_t_ha     carbon returned to the soil in residues + roots (t C/ha), residues retained
#   deep_taproot       true = can help open compacted layers
#   rest_years         full years before the same botanical family may return
#   income_band        0 (no sale, cover crop) .. 5 (highest relative gross-margin potential)
#                      A RELATIVE band for comparing crops - not a price or profit forecast.

meta:
  region: "Central Luzon, Philippines (pilot: Munoz, Nueva Ecija)"
  version: "0.1 (hackathon prototype)"

references:
  FAO56: "Allen, Pereira, Raes & Smith (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56 - Tables 11 (stage lengths), 12 (Kc), 22 (root depth, depletion fraction p)."
  FAO33: "Doorenbos & Kassam (1979). Yield response to water. FAO Irrigation and Drainage Paper 33 - seasonal yield response factors (Ky)."
  FAO29: "Ayers & Westcot (1985). Water quality for agriculture. FAO Irrigation and Drainage Paper 29, Table 4 (crop salt tolerance after Maas & Hoffman 1977)."
  ECOCROP: "FAO ECOCROP crop environmental requirements database (temperature and soil pH ranges), rounded."
  PH_GUIDES: "General Philippine production practice as described in PhilRice / DA-BPI / DOST-PCAARRD crop guides - recalled by the team, not copied from a specific table. Verify locally."
  TEAM: "Team estimate for this prototype (often by analogy with a related crop). Verify with a local agronomist."

crops:
  - id: rice
    name: {en: "Rice (lowland)", fil: "Palay"}
    family: Poaceae
    seasons: [wet, dry]
    duration_days: 115
    t_base_c: 10
    gdd_need: 1850
    t_mean_range_c: [20, 33]
    heat_limit_c: 35
    frost_sensitive: true
    water_need_mm: [450, 700]
    kc: [1.05, 1.20, 0.90]
    stages: [0.20, 0.25, 0.35, 0.20]
    root_depth_m: 0.6
    depletion_p: 0.20
    ky: 1.10
    paddy: true
    salinity_threshold_ds_m: 3.0
    ph_range: [5.0, 7.5]
    heat_tolerance: 3
    drought_tolerance: 1
    waterlogging_tolerance: 5
    n_fixing: false
    n_credit_kg_ha: 0
    n_demand_kg_ha: 90
    residue_cover: 4
    residue_c_t_ha: 1.6
    deep_taproot: false
    rest_years: 0
    income_band: 3
    sources:
      duration_days: PH_GUIDES
      temperature: ECOCROP
      gdd_need: "TEAM - duration x (typical growing temperature - base temperature) x 0.9"
      water_need_mm: FAO33
      kc_stages_root_p: FAO56
      ky: "TEAM - FAO33 has no single seasonal Ky for rice; 1.1 assumed"
      salinity_threshold_ds_m: FAO29
      ph_range: ECOCROP
      tolerances: TEAM
      nitrogen: PH_GUIDES
      residue: TEAM
      rest_years: TEAM
      income_band: TEAM
    verify: [ky, gdd_need, residue_c_t_ha, income_band]

