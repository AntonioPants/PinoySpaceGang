<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lander Sim Viewer</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121922;
        --line: #223042;
        --ink: #d9e3ee;
        --dim: #7d8fa3;
        --accent: #ffb347;
        --ok: #4cd18a;
        --warn: #ffcc4d;
        --bad: #ff5d5d;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--ink);
        background: var(--bg);
      }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 250px 1fr 320px; grid-template-rows: 44px 1fr; }
      header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 14px; margin: 0; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
      header .hint { color: var(--dim); }
      aside, section.right { background: var(--panel); overflow-y: auto; padding: 12px; }
      aside { border-right: 1px solid var(--line); }
      section.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
      main { position: relative; min-width: 0; }
      #side { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      select, input[type='number'], input[type='file'] { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px; font: inherit; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--dim); }
      button { font: inherit; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
      button.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 700; }
      button:hover { filter: brightness(1.15); }
      .buttons { display: flex; gap: 8px; margin-top: 16px; }
      .buttons button { flex: 1; }
      h2 { font-size: 11px; margin: 0 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      #top { width: 100%; aspect-ratio: 1; background: #000; border: 1px solid var(--line); border-radius: 4px; display: block; }
      .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .hud div { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
      .hud span { display: block; color: var(--dim); font-size: 10px; text-transform: uppercase; }
      .hud b { font-size: 16px; font-variant-numeric: tabular-nums; }
      .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
      .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
      #log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; font-size: 12px; }
      #log li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
      #log time { color: var(--dim); margin-right: 6px; }
      #result { display: none; border-radius: 6px; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); }
      #result .outcome { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      #result ul { margin: 6px 0 0; padding-left: 16px; color: var(--dim); }
      #result table { width: 100%; margin-top: 6px; border-collapse: collapse; }
      #result td { padding: 2px 0; }
      #result td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .keys { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 14px; }
      kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--bg); }
      @media (max-width: 1000px) {
        body { grid-template-columns: 1fr; grid-template-rows: 44px auto 60vh auto; }
        main { height: 60vh; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Lander sim viewer</h1>
      <span class="hint" id="status">Pick a setup and launch</span>
    </header>

    <aside>
      <label for="site">Site</label>
      <select id="site"></select>
      <label for="sitesFile">Load sites.json</label>
      <input type="file" id="sitesFile" accept=".json,application/json" />

      <label for="strategy">Strategy</label>
      <select id="strategy">
        <option value="autonomous">Autonomous (hazard avoidance)</option>
        <option value="manual">Manual (keyboard)</option>
      </select>

      <label for="hazard">Hazard sensor</label>
      <select id="hazard">
        <option value="lidar">Lidar</option>
        <option value="camera">Camera</option>
        <option value="none">None</option>
      </select>
      <div class="check"><input type="checkbox" id="velocimeter" checked /><span>Doppler velocimeter</span></div>

      <label for="dust">Dust interference <span id="dustV">0</span></label>
      <input type="range" id="dust" min="0" max="1" step="0.05" value="0" />
      <label for="glare">Glare interference <span id="glareV">0</span></label>
      <input type="range" id="glare" min="0" max="1" step="0.05" value="0" />

      <label for="gravity">Gravity &amp; atmosphere</label>
      <select id="gravity">
        <option value="target">Target body (Moon/Mars)</option>
        <option value="native">Native (where the terrain is)</option>
      </select>

      <div class="row">
        <div><label for="fuel">Fuel kg</label><input type="number" id="fuel" value="1500" min="0" step="100" /></div>
        <div><label for="thrust">Thrust kN</label><input type="number" id="thrust" value="45" min="1" step="1" /></div>
      </div>
      <div class="row">
        <div><label for="seed">Seed</label><input type="number" id="seed" value="1" /></div>
        <div>
          <label for="speed">Speed</label>
          <select id="speed">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4" selected>4×</option>
            <option value="8">8×</option>
          </select>
        </div>
      </div>

      <div class="buttons">
        <button class="primary" id="launch">Launch</button>
        <button id="pause">Pause</button>
      </div>

      <div class="keys">
        Manual: <kbd>W</kbd>/<kbd>S</kbd> throttle · <kbd>←</kbd><kbd>→</kbd> tilt x · <kbd>↑</kbd><kbd>↓</kbd> tilt y ·
        <kbd>X</kbd> cut engine<br />Anytime: <kbd>Space</kbd> pause · <kbd>R</kbd> relaunch
      </div>
    </aside>

    <main><canvas id="side"></canvas></main>

    <section class="right">
      <div>
        <h2>Top view</h2>
        <canvas id="top" width="440" height="440"></canvas>
      </div>
      <div class="hud">
        <div><span>Altitude AGL</span><b id="hAlt">–</b></div>
        <div><span>Time</span><b id="hT">–</b></div>
        <div><span>Sink rate</span><b id="hVz">–</b></div>
        <div><span>Lateral</span><b id="hVh">–</b></div>
        <div><span>Throttle</span><b id="hThr">–</b><div class="bar"><i id="bThr"></i></div></div>
        <div><span>Fuel</span><b id="hFuel">–</b><div class="bar"><i id="bFuel"></i></div></div>
        <div><span>Tilt</span><b id="hTilt">–</b></div>
        <div><span>To aim point</span><b id="hDist">–</b></div>
      </div>
      <div id="result"></div>
      <div>
        <h2>Events</h2>
        <ul id="log"></ul>
      </div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
