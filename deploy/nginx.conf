server {
  listen 3021;
  root /usr/share/nginx/html;
  index index.html;

  # nginx does not know .mjs; browsers refuse to import a module served as octet-stream, and the
  # game imports its terrain and catalog loaders that way
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }

  # compress everything that is text or raw numbers (terrain heights, weather, models)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/octet-stream model/gltf-binary application/geo+json;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Vite puts a content hash in these names, so they can be cached for good
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # loader modules are code: always revalidate, so a fix reaches browsers at once
  location ~ \.mjs$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
  # terrain and textures change rarely, but keep their names: a day, then revalidate
  location ~ ^/(terrain|textures)/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
  # the page itself must always be fresh so a new deploy shows up at once
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
